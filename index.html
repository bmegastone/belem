.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

.g .months{display:grid;font-family:var(--f-mono);font-size:10px;color:var(--muted);border-left:1px solid var(--line)}
.g .months span{padding:4px 2px;border-right:1px dashed var(--line);text-align:center;overflow:hidden;white-space:nowrap}
.bar{position:absolute;top:7px;height:18px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.late{border-color:var(--bad);background:var(--bad-soft)} .bar.late i{background:var(--bad)}
.bar.done{border-color:var(--ok);background:var(--ok-soft)} .bar.done i{background:var(--ok)}

.today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--warn);z-index:1}

.progress-in{width:72px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);text-align:right;font-size:16px}

.done-t{text-decoration:line-through;color:var(--muted)}

function schedule(){
  const contract = S.project.contractEnd || (S.project.startDate ? addMonths(S.project.startDate, +S.project.durationMonths || 24) : null);
  const tsDays = sum(Object.values(S.signoffs).filter(s => s.kind === 'ts' && s.status === 'valide'), s => s.days);
  const wDays = pubAll('livro').filter(l => l.ltype === 'intemperie' && l.stop && signoff('livro', l._k, l.id)?.status === 'vise').length;
  const revised = contract ? addDays(contract, tsDays + wDays) : null;
  let forecast = null;
  S.tasks.forEach(tk => { const d = taskDates(tk); if (!d) return; const st = taskState(tk); const e = st.k === 'late' ? addDays(d.end, st.late) : d.end; if (!forecast || e > forecast) forecast = e; });
  const delay = revised && forecast ? Math.max(0, dayDiff(forecast, revised)) : 0;
  return {contract, revised, forecast, tsDays, wDays, delay};
}

// ---------- planning ----------
function gantt(){
  const tasks = [...S.tasks].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (!tasks.length) return `<p class="muted">${esc(t('emptyP'))}</p>`;
  const hasStart = !!S.project.startDate, sc = schedule();
  const pos = tk => {
    if (hasStart) { const d = taskDates(tk); if (!d) return null; return [monthsBetween(d.start, S.project.startDate), monthsBetween(d.end, S.project.startDate)]; }
    if (tk.m0 != null && tk.m0 !== '') return [+tk.m0, +tk.m0 + (+tk.dm || 0)];
    return null;
  };
  let maxM = +S.project.durationMonths || 24;
  tasks.forEach(tk => { const p = pos(tk); if (p) maxM = Math.max(maxM, Math.ceil(p[1])); });
  if (hasStart && sc.revised) maxM = Math.max(maxM, Math.ceil(monthsBetween(sc.revised, S.project.startDate)) + 1);
  maxM = Math.min(Math.max(maxM, 1), 60);
  const months = Array.from({length:maxM}, (_, i) => {
    if (!hasStart) return 'M' + (i + 1);
    const d = parseD(addMonths(S.project.startDate, i));
    return d.toLocaleDateString(loc(), {month:'short'}) + (d.getMonth() === 0 || i === 0 ? ' ' + String(d.getFullYear()).slice(2) : '');
  });
  const cols = `repeat(${maxM},1fr)`, pct = m => (Math.max(0, m) / maxM * 100).toFixed(2) + '%';
  const todayM = hasStart ? monthsBetween(today(), S.project.startDate) : null;
  const cEnd = hasStart && sc.revised ? monthsBetween(sc.revised, S.project.startDate) : null;
  let h = `<div class="gantt"><div class="g"><div class="lab muted small">${hasStart ? '' : esc(t('noDate'))}</div><div class="months" style="grid-template-columns:${cols}">${months.map(m => `<span>${esc(m)}</span>`).join('')}</div>`;
  tasks.forEach(tk => {
    const p = pos(tk), st = taskState(tk), pr = progVal(tk);
    const cls = st.k === 'done' ? 'done' : (st.k === 'late' || st.k === 'behind') ? 'late' : '';
    h += `<div class="lab" title="${esc(tk.name)}">${tk.lot ? lotChip(tk.lot) + ' ' : ''}${esc(tk.name)}</div><div class="trk"><div class="gridlines" style="grid-template-columns:${cols}">${months.map(() => '<span></span>').join('')}</div>`;
    if (todayM != null && todayM >= 0 && todayM <= maxM) h += `<div class="today" style="left:${pct(todayM)}"></div>`;
    if (cEnd != null && cEnd >= 0 && cEnd <= maxM) h += `<div class="cend" style="left:${pct(cEnd)}"></div>`;
    if (p) h += tk.milestone ? `<div class="mile" style="left:${pct(p[0])}" title="${esc(t('milestone'))}"></div>` : `<div class="bar ${cls}" style="left:${pct(p[0])};width:${pct(Math.max(0.15, p[1] - p[0]))}" title="${pr} %"><i style="width:${pr}%"></i></div>`;
    h += `</div>`;
  });
  return h + `</div></div>${hasStart ? `<div class="legend"><span><i style="border-left:2px solid var(--warn)"></i>${esc(t('todayL'))}</span><span><i style="border-left:2px dashed var(--bad)"></i>${esc(t('revisedEnd'))}</span></div>` : ''}`;
}
function vPlan(){
  const sc = schedule();
  const myLots = S.members[S.uid]?.lots || [];
  const tasks = [...S.tasks].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const rows = tasks.map(tk => {
    const d = taskDates(tk), st = taskState(tk), dec = declared(tk), pb = predsBlocking(tk), vb = visaBlocking(tk);
    const stl = {done:pillTxt(t('done'), 'ok'), late:pillTxt(st.late + ' ' + t('daysLate'), 'bad'), behind:pillTxt('≈ ' + st.late + ' ' + t('daysLate'), 'warn'), ok:pillTxt(t('onTime'), 'info'), future:pillTxt(t('notStarted')), nodate:pillTxt('—')}[st.k];
    const block = (pb.length || vb) && st.k !== 'done' ? `<div class="small" style="color:var(--bad)">${esc(t('blocked'))} : ${esc([...pb.map(p => p.name), vb ? t('visaReq') : ''].filter(Boolean).join(', '))}</div>` : '';
    const canDecl = canPost() && !isAdmin() && (!myLots.length || !tk.lot || myLots.includes(tk.lot));
    const declCell = canDecl ? `<input class="progress-in" type="number" min="0" max="100" step="5" value="${dec && dec._k === S.uid ? +dec.value : ''}" data-decl="${esc(tk.id)}" id="decl-${esc(tk.id)}" aria-label="${esc(t('progDecl'))}"> %` : (dec ? `${+dec.value} %<div class="small muted">${esc(authorLine(dec._k))}</div>` : '—');
    const valCell = isAdmin() ? `<input class="progress-in" type="number" min="0" max="100" step="5" value="${progVal(tk)}" data-val="${esc(tk.id)}" id="val-${esc(tk.id)}" aria-label="${esc(t('progVal'))}"> %` : `${progVal(tk)} %`;
    return `<tr><td>${lotChip(tk.lot)}</td><td>${tk.milestone ? '◆ ' : ''}${esc(tk.name)}${tk.company ? `<div class="small muted">${esc(tk.company)}</div>` : ''}${block}</td><td>${d ? fmtDate(d.start) : (tk.m0 != null && tk.m0 !== '' ? 'M' + (+tk.m0 + 1) : '—')}</td><td>${d ? fmtDate(d.end) : (tk.dm ? (+tk.dm) + ' ' + esc(t('months')) : '—')}</td><td class="num">${declCell}</td><td class="num">${valCell}${isAdmin() && dec && +dec.value !== progVal(tk) ? ' ' + btn('acceptDecl', '← ' + dec.value + ' %', 'sm', `data-id="${esc(tk.id)}" data-v="${+dec.value}"`) : ''}</td><td>${stl}</td><td><div class="actions">${isAdmin() ? btn('editTask', t('edit'), 'sm', `data-id="${esc(tk.id)}"`) + delBtn('tasks', tk.id) : ''}</div></td></tr>`;
  }).join('');
  const kv = `<section class="panel"><div class="body"><dl class="kv">
    <dt>${esc(t('contractEnd'))}</dt><dd>${sc.contract ? fmtDate(sc.contract) : esc(t('noDate'))}</dd>
    <dt>${esc(t('tsExt'))}</dt><dd>+${sc.tsDays} ${esc(t('days'))}</dd>
    <dt>${esc(t('weatherExt'))}</dt><dd>+${sc.wDays} ${esc(t('days'))}</dd>
    <dt>${esc(t('revisedEnd'))}</dt><dd><b>${sc.revised ? fmtDate(sc.revised) : '—'}</b></dd>
    <dt>${esc(t('forecastEnd'))}</dt><dd>${sc.forecast ? fmtDate(sc.forecast) : '—'} ${sc.delay > 0 ? pillTxt(sc.delay + ' ' + t('daysLate'), 'bad') : ''}</dd>
  </dl></div></section>`;
  return head('plan', isAdmin() ? btn('newTask', '+ ' + t('task'), 'primary') : '') + banner() + kv +
   `<section class="panel"><div class="body">${gantt()}</div></section>
   <section class="panel">${table([[t('lot')],[t('task')],[t('start')],[t('end')],[t('progDecl'),'num'],[t('progVal'),'num'],[t('status')],['']], rows || `<tr><td colspan="8">${empty('emptyP','emptyP')}</td></tr>`)}</section>
   ${tasks.some(x => x.source) ? `<p class="small muted">${esc(t('source'))} : ${esc([...new Set(tasks.map(x => x.source).filter(Boolean))].join(' · '))}</p>` : ''}`;

// ================= forms =================
function lotOptions(){ return [{v:'', l:'—'}, ...[...S.lots].sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).map(l => ({v:l.code, l:l.code + ' — ' + (lang === 'pt' ? l.pt : l.fr)}))]; }
function myCompany(){ return S.members[S.uid]?.company || (S.isOwner ? (S.project.client || '') : ''); }
function openForm(title, sub, fields, initial, onSave){
  const layer = $('#layer'), opener = document.activeElement;
  const fid = 'f' + Math.random().toString(36).slice(2, 7);
  const fieldHtml = f => {
    const id = fid + '-' + f.k, v = initial[f.k] ?? f.def ?? '';
    let input;
    if (f.type === 'select') input = `<select id="${id}" name="${f.k}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
    else if (f.type === 'multi') input = `<select id="${id}" name="${f.k}" multiple size="6">${f.options.map(o => `<option value="${esc(o.v)}" ${(v || []).includes(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
    else if (f.type === 'check') input = `<span class="chk"><input id="${id}" name="${f.k}" type="checkbox" ${v ? 'checked' : ''}><span class="small">${esc(f.hint || '')}</span></span>`;
    else if (f.type === 'file' || f.type === 'files') input = `<input id="${id}" name="${f.k}" type="file" accept="application/pdf,image/*" ${f.type === 'files' ? 'multiple' : ''}><span class="hint">${esc(f.hint || t('fileHint'))}</span>`;
    else input = `<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${f.type === 'number' ? 'step="any" inputmode="decimal"' : ''}>`;
    return `<div class="f ${f.wide ? 'wide' : ''} ${f.locked ? 'locked' : ''}"><label for="${id}">${esc(f.label)}</label>${input}${f.locked ? `<span class="hint">${esc(t('lockedHint'))}</span>` : ''}</div>`;
  };
  layer.innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}<form novalidate>${fields.map(fieldHtml).join('')}<div class="err" role="alert" hidden></div><div class="formfoot"><button type="button" class="btn" data-x>${esc(t('cancel'))}</button><button type="submit" class="btn primary">${esc(t('save'))}</button></div></form></div></div>`;
  const form = layer.querySelector('form'), err = layer.querySelector('.err');
  const closeIt = () => { if (UI.busy) return; layer.innerHTML = ''; layer._close = null; if (opener && opener.isConnected && opener.focus) try { opener.focus(); } catch (e) {} if (pendingRender) { pendingRender = false; render(); } };
  layer.querySelector('[data-x]').onclick = closeIt;
  layer._close = closeIt;
  const first = form.querySelector('input:not([type=checkbox]),select,textarea'); if (first) first.focus();
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.hidden = true;
    const out = {};
    for (const f of fields) {
      const el = form.elements[f.k];
      if (f.type === 'file' || f.type === 'files') { out[f.k] = el.files ? [...el.files] : []; continue; }
      if (f.type === 'multi') { out[f.k] = [...el.selectedOptions].map(o => o.value); continue; }
      if (f.type === 'check') { out[f.k] = el.checked; continue; }
      out[f.k] = f.type === 'number' ? (el.value === '' ? null : +String(el.value).replace(',', '.')) : el.value.trim();
      if (f.req && (out[f.k] === '' || out[f.k] == null || (f.type === 'number' && isNaN(out[f.k])))) { err.textContent = t('errReq') + ' : ' + f.label; err.hidden = false; el.focus(); return; }
    }
    const sb = form.querySelector('[type=submit]'); sb.disabled = true; UI.busy = true;
    try { await onSave(out); UI.busy = false; closeIt(); toast(t('saved')); }
    catch (x) { UI.busy = false; err.textContent = x && x.upload ? t('errUpload') : t('errWrite'); err.hidden = false; sb.disabled = false; console.warn(x); }
  });
}

  const a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;
  const subsItem = (kk, iid) => (S.subs[kk] || []).find(x => x.id === iid);
  try {
    switch (a) {
      case 'newQuote': return formQuote();
      case 'editQuote': return formQuote(findMine(S.subs, id));
      case 'decideQuote': return decideForm('quote', k, id);
      case 'orderFrom': { const q = subsItem(k, id); if (!q) return; const d = decOf(k, 'quote', id); return formOrder(null, {company:q.company, object:q.title, lot:q.lot, amount:d?.amount ?? q.amount, memberKey:k === 'owner' ? '' : k, source:'quote:' + k + ':' + id}); }
      case 'newTs': return formTs();
      case 'editTs': return formTs(findMine(S.subs, id));
      case 'decideTs': return decideForm('ts', k, id);
      case 'orderFromTs': { const x = subsItem(k, id); if (!x) return; const d = decOf(k, 'ts', id); return formOrder(null, {company:S.members[k]?.company || '', object:(signoff('ts', k, id)?.num || 'TS') + ' — ' + x.title, lot:x.lot, amount:d?.amount ?? x.amount, memberKey:k === 'owner' ? '' : k, source:'ts:' + k + ':' + id}); }
      case 'newOrder': return formOrder();
      case 'editOrder': return formOrder(S.orders.find(x => x.id === id));
      case 'cancelOrder': return formCancelOrder(S.orders.find(x => x.id === id));
      case 'newAuto': return formAuto();
      case 'editAuto': return formAuto(findMine(S.subs, id));
      case 'decideAuto': return decideAuto(k, id);
      case 'newJournal': return formJournal();
      case 'editJournal': return formJournal(findMine(S.pub, id));
      case 'newLivro': return formLivro();
      case 'signLivro': { const l = (S.pub[k] || []).find(x => x.id === id); await db.collection('signoffs').doc('livro_' + k + '_' + id).set({kind:'livro', status:'vise', snapshot:l?.text || '', at:nowIso()}); toast(t('saved')); return; }
      case 'newMeeting': return formMeeting();
      case 'editMeeting': return formMeeting(S.meetings.find(x => x.id === id));
      case 'newIssue': return formIssue();
      case 'editIssue': return formIssue(findMine(S.pub, id));
      case 'markDone': return formMarkDone(findMine(S.pub, id));
      case 'liftIssue': await db.collection('signoffs').doc('issue_' + k + '_' + id).set({kind:'issue', status:b.dataset.st, at:nowIso()}); toast(t('saved')); return;
      case 'newRfi': return formRfi();
      case 'editRfi': return formRfi(findMine(S.pub, id));
      case 'answerRfi': return formAnswer(k, id);
      case 'newDoc': return formDoc();
      case 'editDoc': return formDoc(findMine(S.pub, id));
      case 'newTask': return formTask();
      case 'editTask': return formTask(S.tasks.find(x => x.id === id));
      case 'acceptDecl': await db.collection('tasks').doc(id).update({progress:+b.dataset.v, progressAt:nowIso()}); toast(t('saved')); return;
      case 'join': return formJoin();
      case 'approve': return formMember(id, S.joinsAll[id]);
      case 'editMember': return formMember(id);
      case 'editProject': return formProject();
      case 'askDel': { const key = b.dataset.path + '/' + id; UI.confirmDel = key; render(); setTimeout(() => { if (UI.confirmDel === key) { UI.confirmDel = null; render(); } }, 4000); return; }
      case 'doDel': UI.confirmDel = null; await db.collection(b.dataset.path).doc(id).delete(); toast(t('deleted')); return;
    }
  } catch (x) { console.warn(x); toast(t('errWrite')); }
});
['fr','pt'].forEach(l => $('#lang-' + l).addEventListener('click', () => { lang = l; try { localStorage.setItem('belem.lang', l); } catch (e) {} render(); }));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h)) { view = h; UI.confirmDel = null; pendingRender = false; render(); window.scrollTo(0, 0); } });
document.addEventListener('keydown', e => { const L = $('#layer'); if (e.key === 'Escape' && L._close) L._close(); });

// ================= profiles =================
let profBusy = false;
async function resolveProfiles(){
  if (!user || profBusy) return;
  const ids = [S.uid, ...Object.keys(S.members), ...Object.keys(S.joinsAll)].filter(Boolean);
  const missing = [...new Set(ids)].filter(i => !(i in S.profiles));
  if (!missing.length) return;
  profBusy = true;
  missing.forEach(i => { S.profiles[i] = {}; });
  try { const ps = await user.profiles(missing); Object.assign(S.profiles, ps); } catch (e) {}
  profBusy = false; render();
}

// ================= boot =================
const subsMap = { pub:{}, subs:{}, granted:{} };
function listenKey(store, k){
  if (subsMap[store][k] || !db) return;
  subsMap[store][k] = db.collection(`${store}/${k}/items`).onSnapshot(s => { S[store][k] = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => { console.warn(store, k, e); });
}
function syncListeners(){
  keys().forEach(k => listenKey('pub', k));
  if (S.isOwner) { keys().forEach(k => listenKey('subs', k)); Object.keys(S.members).forEach(k => listenKey('granted', k)); }
  else if (S.uid) { listenKey('subs', S.uid); listenKey('granted', S.uid); }
}
async function boot(){
  $('#loading').textContent = t('loading');
  try {
    const c = window.claude;
    if (!c || !c.use) { render(); return; }
    [user, db] = await Promise.all([c.use('user'), c.use('db')]);
    assetsP = c.use('assets').catch(() => null);
    if (user) {
      S.me = await user.me(); S.uid = S.me.id; S.isOwner = !!S.me.isOwner;
      try { S.canWrite = await user.can('data.write'); } catch (e) {}
    }
    if (!db) { render(); return; }
    const listen = (col, key) => db.collection(col).onSnapshot(s => { S[key] = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.warn(col, e));
    listen('tasks', 'tasks'); listen('orders', 'orders'); listen('lots', 'lots'); listen('meetings', 'meetings');
    db.collection('signoffs').onSnapshot(s => { S.signoffs = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, e => console.warn(e));
    db.collection('members').onSnapshot(s => { S.members = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); syncListeners(); render(); }, e => console.warn(e));
    db.doc('project/info').onSnapshot(s => { S.project = s.exists ? s.data() : {}; render(); }, e => console.warn(e));
    if (S.isOwner) db.collection('joins').onSnapshot(s => { S.joinsAll = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, e => console.warn(e));
    else if (S.uid) db.doc('joins/' + S.uid).onSnapshot(s => { S.myJoin = s.exists ? s.data() : null; render(); }, e => console.warn(e));
    syncListeners();
    render();
  } catch (e) { console.error(e); bootErr = true; render(); }
}
window.addEventListener('belem:urls', () => render());
boot();
})();
